# Pushing a version tag (v1.22.0) builds that commit, makes the GitHub release with its jar (the notes come from
# .github/release-notes.md), and publishes the same jar to Modrinth. A release made here by the workflow's own token
# doesn't set off modrinth.yml, so Modrinth is done here too.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: chmod +x gradlew && ./gradlew build
      - name: The release's name and jar
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "NAME=Naughty or Nice $v" >> "$GITHUB_ENV"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          ls build/libs
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.NAME }}
          body_path: .github/release-notes.md
          files: build/libs/naughty-or-nice-${{ env.VERSION }}+1.21.11.jar
      - name: Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: pp4L2nZU
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/!(*-@(dev|sources|javadoc)).jar
          name: ${{ env.NAME }}
          changelog-file: .github/release-notes.md
          loaders: fabric
          game-versions: 1.21.11
          dependencies: fabric-api(required)
          version-type: release
